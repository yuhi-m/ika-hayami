}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#131227;--card:#1D1B36;--ink:#F1F0FA;--muted:#ABA8C6;--faint:#8A87A4;--rule:#35325A;--dot:rgba(241,240,250,.05)}}
:root[data-theme="dark"]{--paper:#131227;--card:#1D1B36;--ink:#F1F0FA;--muted:#ABA8C6;--faint:#8A87A4;--rule:#35325A;--dot:rgba(241,240,250,.05)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;min-height:100%;background:var(--paper);background-image:radial-gradient(var(--dot) 1px,transparent 1.4px);background-size:14px 14px;color:var(--ink);font:400 16px/1.75 var(--body);-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--opp);outline-offset:2px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:560px;margin:0 auto}

/* ---------- 上部の操作 ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.bar-row{display:flex;gap:8px;align-items:center;padding:10px 14px 6px}
.picker{flex:1;min-width:0;position:relative}
.picker select,.search input{width:100%;min-height:44px;border:2px solid var(--ink);border-radius:12px;background:var(--card);font-weight:700;padding:0 38px 0 12px;appearance:none;-webkit-appearance:none}
.picker::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.icon-btn{flex:0 0 auto;min-width:44px;height:44px;border:2px solid var(--ink);border-radius:12px;background:var(--card);font-weight:700;font-size:14px;padding:0 10px;cursor:pointer}
.icon-btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.icon-btn svg{display:block;margin:auto}
.search{padding:0 14px 6px;position:relative}
.search button{position:absolute;right:18px;top:0;height:44px;width:40px;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
@media (hover:hover) and (pointer:fine){.chips{flex-wrap:wrap;overflow:visible}}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border:1.5px solid var(--rule);border-radius:999px;background:var(--card);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip i{width:14px;height:14px;background:var(--c,var(--ink));-webkit-mask:var(--splat2) center/contain no-repeat;mask:var(--splat2) center/contain no-repeat}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.count{padding:0 14px 8px;font-size:12px;color:var(--muted);margin:-4px 0 0}

/* ---------- ヒーロー ---------- */
.hero{position:relative;background:var(--own);color:var(--on-own);padding:22px 18px 26px;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(color-mix(in srgb,var(--on-own) 16%,transparent) 1.3px,transparent 1.8px);background-size:9px 9px;-webkit-mask:linear-gradient(115deg,transparent 35%,#000 100%);mask:linear-gradient(115deg,transparent 35%,#000 100%)}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px;font-size:13px;font-weight:700}
.hero-meta span{opacity:.82}
.mascots{position:absolute;right:14px;top:16px;display:flex;align-items:flex-end;gap:2px}
.mascot{width:30px;height:34px}
.mascot.squid{fill:var(--on-own);transform:rotate(-8deg)}
.mascot.octo{width:38px;height:36px;color:var(--opp);fill:currentColor;transform:rotate(6deg)}
.hero-meta{padding-right:76px}
.hero h1{margin:0;font:400 clamp(30px,9.4vw,48px)/1.12 var(--display);letter-spacing:.01em;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.sticker{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:6px;font-size:13px;font-weight:700;background:var(--on-own);color:var(--own);transform:rotate(-2deg)}
.sticker.alt{background:transparent;color:var(--on-own);box-shadow:0 0 0 2px var(--on-own) inset;transform:rotate(1.5deg)}
.gist{margin:14px 0 0;font-size:17px;font-weight:700;line-height:1.65}
.replica{margin:8px 0 0;font-size:13px;opacity:.85}
.drip{display:block;width:100%;height:34px;color:var(--own);margin-top:-1px}

/* ---------- 共通ブロック ---------- */
.block{margin:0 12px 14px;background:var(--card);border-radius:18px;padding:16px 16px 12px;border:1px solid var(--rule)}
.block h2{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:15px;font-weight:700;line-height:1.4}
.block h2::before{content:"";width:20px;height:20px;background:var(--own);-webkit-mask:var(--splat1) center/contain no-repeat;mask:var(--splat1) center/contain no-repeat;transform:rotate(-12deg)}
.block.warn h2::before{background:var(--opp)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.6}
.scope{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:10px 0 2px}
.scope:first-of-type{margin-top:0}
.items{list-style:none;margin:0;padding:0}
.items li{padding:9px 0;border-top:1px solid var(--rule)}
.items li:first-child{border-top:0}
.items b{display:block;font-weight:700;line-height:1.5}
.items .d{display:block;font-size:14.5px;line-height:1.7;margin-top:2px}
.lv{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;margin-right:6px;border:1.5px dashed currentColor;border-radius:4px;vertical-align:1px;color:var(--muted)}
details.more{margin-top:6px;border-top:1px solid var(--rule)}
details.more summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:14px;font-weight:700;color:var(--muted);list-style:none}
details.more summary::before{content:"+";display:inline-grid;place-items:center;width:20px;height:20px;margin-right:8px;border-radius:50%;border:1.5px solid currentColor;font-size:14px;line-height:1}
details.more[open] summary::before{content:"−"}
details.more summary::-webkit-details-marker{display:none}

/* ---------- 射程メーター（このページの主役） ---------- */
.meter-card{margin:-6px 12px 14px;position:relative;z-index:1;box-shadow:0 10px 24px -14px rgba(27,24,56,.45)}
.meter{--max:8;position:relative;margin:4px 0 0;padding:20px 0 4px}
.meter .scale{position:absolute;inset:0 44px 0 70px;pointer-events:none}
.meter .scale span{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--rule)}
.meter .scale span b{position:absolute;top:0;left:-6px;width:12px;text-align:center;font:700 10px/1 var(--body);color:var(--muted)}
.mrow{display:grid;grid-template-columns:70px 1fr 44px;align-items:center;min-height:36px;position:relative}
.mrow dt{font-size:12.5px;font-weight:700;color:var(--muted)}
.mrow dd{margin:0}
.mrow .num{text-align:right;font:400 18px/1 var(--display);font-variant-numeric:tabular-nums}
.track{position:relative;height:18px}
.fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--v) / var(--max) * 100%);border-radius:3px 12px 12px 3px}
.fill.reach{background:var(--own);box-shadow:0 0 0 2px var(--ink) inset}
.fill.reach::after{content:"";position:absolute;right:-12px;top:50%;width:26px;height:26px;margin-top:-13px;background:var(--own);-webkit-mask:var(--splat1) center/contain no-repeat;mask:var(--splat1) center/contain no-repeat}
.fill.paint{background:repeating-linear-gradient(-45deg,var(--own) 0 4px,color-mix(in srgb,var(--own) 35%,var(--card)) 4px 8px);opacity:.95}
.mlabel{grid-column:2 / 4;font-size:11px;color:var(--muted);margin:-2px 0 4px}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin:12px 0 0;padding:0}
.keys div{background:var(--paper);border-radius:12px;padding:8px 10px}
.keys dt{font-size:11px;font-weight:700;color:var(--muted)}
.keys dd{margin:2px 0 0;font:400 17px/1.25 var(--display);overflow-wrap:anywhere}
.loadout{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 0}
.loadout div{border:1.5px solid var(--ink);border-radius:12px;padding:6px 10px}
.loadout dt{font-size:11px;font-weight:700;color:var(--muted)}
.loadout dd{margin:0;font-weight:700;font-size:14.5px;line-height:1.45}
.loadout dd small{font-weight:700;color:var(--muted);margin-left:4px}
.spec{margin:0;padding:0}
.spec div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px;padding:7px 0;border-top:1px solid var(--rule);font-size:13.5px;line-height:1.55}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-weight:700;white-space:pre-line;font-variant-numeric:tabular-nums}
.stale{margin:0 12px 14px;padding:10px 14px;border-radius:14px;background:var(--opp-soft);border:1.5px solid var(--opp);font-size:13.5px}
.stale b{display:block}

/* ---------- やること / やってはいけない ---------- */
.todo{counter-reset:t;list-style:none;margin:0;padding:0}
.todo li{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.todo li:first-child{border-top:0}
.todo li::before{counter-increment:t;content:counter(t);width:48px;height:48px;margin:-6px 0 0 -7px;display:grid;place-items:center;font:400 18px/1 var(--display);background:var(--own);color:var(--on-own);-webkit-mask:var(--splat4) center/contain no-repeat;mask:var(--splat4) center/contain no-repeat}
.todo li:nth-child(2)::before{-webkit-mask-image:var(--splat5);mask-image:var(--splat5)}
.todo li:nth-child(3)::before{-webkit-mask-image:var(--splat6);mask-image:var(--splat6)}

.todo b{display:block;line-height:1.5}.todo .d{display:block;font-size:14.5px;line-height:1.7;margin-top:2px}

.gear li{padding:10px 0}

.gtag{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:5px;border:1.5px solid var(--ink)}

.amount{display:block;font-size:13px;font-weight:700;margin:4px 0 0;padding:3px 8px;border-radius:8px;background:var(--own-soft);width:fit-content;max-width:100%}

.source{margin:6px 16px 24px;font-size:12.5px;color:var(--muted);line-height:1.6}
.source a{font-weight:700;overflow-wrap:anywhere}
.source p{margin:0 0 4px}

/* ---------- 射程比較 ---------- */
.range-head{padding:18px 16px 6px}
.range-head h2{margin:0;font:400 26px/1.2 var(--display)}
.range-head p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.sortbar{display:flex;gap:6px;margin:12px 0 0}.sortbar .chip{--c:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 0}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:22px;height:10px;border-radius:2px 6px 6px 2px}
.rlist{list-style:none;margin:0 12px 24px;padding:6px 12px 10px;background:var(--card);border:1px solid var(--rule);border-radius:18px;position:relative}
.rlist li{display:grid;grid-template-columns:8.6em minmax(0,1fr) 54px;align-items:center;gap:8px;min-height:40px;border-top:1px solid var(--rule)}
.rlist li:first-child{border-top:0}
.rlist a{font-size:13px;font-weight:700;text-decoration:none;line-height:1.3;overflow-wrap:anywhere}
.rlist a small{display:block;font-size:10.5px;color:var(--muted);font-weight:700}
.rlist .track{height:14px;--max:8;background:repeating-linear-gradient(90deg,transparent 0 calc(100% / 8 - 1.5px),var(--rule) calc(100% / 8 - 1.5px) calc(100% / 8))}
.rlist .fill.reach::after{display:none}
.rlist .fill.reach{box-shadow:0 0 0 1.5px var(--ink) inset;height:8px;top:3px;bottom:auto}
.rlist .fill.paint{opacity:.55}
.rlist .rscale{min-height:24px;border:0}.rlist .ticks{position:relative;height:14px}.rlist .ticks b{position:absolute;top:0;width:14px;margin-left:-7px;text-align:center;font:700 10px/1 var(--body);color:var(--muted)}
.rlist .num{font:400 14px/1 var(--display);text-align:right;font-variant-numeric:tabular-nums}
.rlist .num small{display:block;margin-top:5px;font:700 13px/1 var(--body);color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.rlist .stale-mark{color:var(--opp)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty button{margin-top:8px;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--ink);background:var(--card);font-weight:700;cursor:pointer}

@media (prefers-reduced-motion:no-preference){
  .meter .fill{animation:spray .55s cubic-bezier(.2,.8,.2,1) both}
  .meter .fill.paint{animation-delay:.08s}
  @keyframes spray{from{width:0}}
}

をよく使うなら、いつでも投げられるインクを保ちやすくする"},{"tag":"好みで","h":"スペシャル増加量アップ","d":"トルネードで敵を退かせる機会を増やす。特にヤグラでグレートバリアへ対応したい時に使う"}],"display":{"todo":[{"scope":"main","index":0},{"scope":"main","index":1},{"scope":"kit","index":0}],"dont":[{"scope":"main","index":0},{"scope":"main","index":1},{"scope":"kit","index":0}],"good":[],"bad":[]},"src":{"url":"https://wikiwiki.jp/splatoon3mix/%E3%83%96%E3%82%AD/H3%E3%83%AA%E3%83%BC%E3%83%AB%E3%82%AC%E3%83%B3SNAK","mod":"2026-09-25"},"inherit":null,"aliases":[]},{"id":"shooter-squeezer","main":"shooter_squeezer","name":"ボトルガイザー","sub":"スプラッシュシールド","special":"ウルトラショット","points":"220p","role":{"pos":"中衛","text":"シールド越しの射撃"},"gist":"初弾と塗りを使い分け、要所ではシールド越しに攻める。さらに遠い相手へウルトラショットを届かせる","todo":[{"h":"ウルトラショットの足場を確認する","d":"敵インク上では発動しない。正面から撃つ時は先にシールドを張り、発射前後の隙を守る"}],"dont":[{"h":"残量を見ずにシールドを置かない","d":"初弾もインク消費が重い。敵に近づかれてから慌てて置くと、その後の射撃が苦しくなる"},{"h":"狭い通路へ無警戒に入らない","d":"隠れた敵を調べるのが苦手。マップや音から位置を読み、近距離の不意打ちを警戒する"}],"good":[],"bad":[],"kit":[{"h":"スプラッシュシールド","d":"要所で身を守り、初弾を一方的に当てる時間を作る。角や壁にぶつけて近くへ置く使い方もあるが、裏側のボム誘爆に注意する"},{"h":"ウルトラショット","d":"メインより遠いスピナーやチャージャーに使う。正面ではシールドで守り、発動前に足場も確認する"}],"tips":[],"gear":[{"tag":"好みで","h":"スペシャル減少量ダウン","d":"倒された後もウルトラショットを準備しやすくする"},{"tag":"好みで","h":"スペシャル性能アップ","d":"GP6でウルトラショットを約0.5秒延長できる。狙う時間が足りず3発目を逃しがちな時に役立つ"}],"display":{"todo":[{"scope":"main","index":0},{"scope":"main","index":1},{"scope":"kit","index":0}],"dont":[{"scope":"main","index":0},{"scope":"kit","index":0},{"scope":"kit","index":1}],"good":[{"scope":"main","index":0},{"scope":"main","index":1}],"bad":[]},"src":{"url":"https://wikiwiki.jp/splatoon3mix/%E3%83%96%E3%82%AD/%E3%83%9C%E3%83%88%E3%83%AB%E3%82%AC%E3%82%A4%E3%82%B6%E3%83%BC","mod":"2026-09-25"},"inherit":null,"aliases":[]},{"id":"shooter-squeezer-foil","main":"shooter_squeezer","name":"ボトルガイザーフォイル","sub":"ロボットボム","special":"スミナガシート","points":"190p","role":{"pos":"中衛","text":"索敵から攻める"},"gist":"ロボットボムで隠れた敵を見つけ、初弾の射撃で追う。シートで視界を遮る前にも索敵を済ませる","todo":[{"h":"入り組んだ場所へ先にロボットボムを投げる","d":"不意の遭遇を防ぎ、反応した敵へ初 <script>
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
'use strict';
const DATA=JSON.parse(document.getElementById('cards-data').textContent);
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=x=>Array.isArray(x)?x:[];
const KEY='buki-card:last';
const MAX=8;
// 系統ごとの「自チーム色／相手チーム色」。公式の色指定ではなく、このページ用に決めた配色
const TEAM={
 'シューター':['#DF6624','#343BC4'],'ローラー':['#A0C937','#BA30B0'],'チャージャー':['#1BBFAB','#C43A6E'],
 'スピナー':['#D0BF08','#3A0CCD'],'スロッシャー':['#1EC0AD','#D74B31'],'ブラスター':['#C12D74','#2CB721'],
 'マニューバー':['#1A1AAF','#E38D24'],'シェルター':['#BFCD41','#6325CD'],'ワイパー':['#CD510A','#6E04B6'],
 'フデ':['#9025C6','#CFB121'],'ストリンガー':['#2CB721','#C12D74']
};
const CLASSES=[...new Set(Object.values(DATA.mains).map(m=>m.class))];
const lum=hex=>{const n=parseInt(hex.slice(1),16),c=[n>>16,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const onColor=hex=>lum(hex)>.32?'#1B1838':'#FFFFFF';
function setTeam(cls){const [own,opp]=TEAM[cls]||['#FF7A1A','#2F5BFF'];const r=document.documentElement.style;r.setProperty('--own',own);r.setProperty('--on-own',onColor(own));r.setProperty('--opp',opp);r.setProperty('--on-opp',onColor(opp));}

const byId=new Map(DATA.kits.map(k=>[k.id,k]));
const EMPTY=v=>v==null||v===''||(Array.isArray(v)&&!v.length);
function eff(k,seen=new Set()){ // レプリカなどは元ブキの内容を引き継ぐ
  const b=k.inherit&&byId.get(k.inherit);if(!b||seen.has(b.id))return k;seen.add(k.id);const base=eff(b,seen);const out={...base,...k};
  for(const f of ['sub','special','points','role','gist','todo','dont','good','bad','kit','gear','tips','display'])if(EMPTY(k[f]))out[f]=base[f];
  out.inheritedFrom=b;return out;}
const cls=k=>DATA.mains[k.main]?.class||'その他';

let state={q:'',cls:'all',view:'card',id:'',rsort:'reach'},filtered=[];
const norm=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96));
function matches(raw){const k=eff(raw),m=DATA.mains[k.main];if(state.cls!=='all'&&m.class!==state.cls)return false;
 const hay=norm([k.name,m.name,m.class,k.sub,k.special,k.role?.text,k.role?.pos,list(k.aliases).join(' ')].join(' '));
 return norm(state.q).split(/\s+/).filter(Boolean).every(t=>hay.includes(t));}

/* ---- 部品 ---- */
const drip='<svg class="drip" viewBox="0 0 400 30" preserveAspectRatio="none" aria-hidden="true"><path fill="currentColor" d="M0 0h400v8c-14 0-18 4-24 4s-6 14-11 14-5-14-11-14H318c-9 0-9 9-15 9s-5-9-14-9h-61c-8 0-9 16-15 16s-6-16-15-16h-52c-8 0-9 6-14 6s-6-6-14-6H72c-9 0-8 12-14 12s-6-12-14-12H0Z"/></svg>';
const fmt=v=>Number.isInteger(v)?v.toFixed(1):String(v);
const shortLabel=l=>l==='有効射程'?'':l.replace(/^有効射程/,'').replace(/[（）]/g,' ').replace(/1周→フルチャージ/,'フル').replace(/フルチャージ/,'フル').trim();
function meter(m){const me=m.meter||{};if(me.reach==null&&me.paint==null)return '<p class="note">射程の数値が出典にありません</p>';
 const ticks=Array.from({length:MAX},(_,i)=>`<span style="left:${(i+1)/MAX*100}%"><b>${i+1}</b></span>`).join('');
 const row=(name,v,cls)=>v==null?'':`<div class="mrow"><dt>${name}</dt><dd class="track"><span class="fill ${cls}" style="--v:${Math.min(v,MAX)}"></span></dd><dd class="num">${fmt(v)}</dd></div>`;
 return `<dl class="meter" style="--max:${MAX}"><div class="scale" aria-hidden="true">${ticks}</div>${row('射程',me.reach,'reach')}${me.reachLabel&&me.reachLabel!=='有効射程'?`<div class="mrow"><span></span><span class="mlabel">${esc(me.reachLabel)}の値</span></div>`:''}${row('塗り射程',me.paint,'paint')}</dl>`;}
function items(rows,cssClass='items'){return `<ul class="${cssClass}">${rows.map(r=>`<li><b>${r.lv?`<span class="lv">${esc(r.lv)}</span>`:''}${esc(r.h)}</b>${r.d?`<span class="d">${esc(r.d)}</span>`:''}</li>`).join('')}</ul>`;}
function grouped(entries,cssClass){const out=[];for(const scope of ['main','kit']){const rows=entries.filter(e=>e.scope===scope).map(e=>e.row);if(rows.length)out.push(`<span class="scope">${scope==='main'?'系統共通':'このブキ'}</span>${items(rows,cssClass)}`);}return out.join('');}
function pick(k,m,f){const refs=list(k.display?.[f]);if(refs.length)return refs.map(r=>({scope:r.scope,row:list(r.scope==='main'?m[f]:k[f])[r.index]})).filter(e=>e.row);
 return [...list(m[f]).map(row=>({scope:'main',row})),...list(k[f]).map(row=>({scope:'kit',row}))];}
function gearList(rows){return `<ul class="items gear">${rows.map(r=>{const t=r.tag||'';const c=t==='軸'?'main':t==='好みで'?'pref':'';
 return `<li><div class="gh">${t?`<span class="gtag ${c}">${esc(t)}</span>`:''}<b>${esc(r.h)}</b>${r.gp?`<span class="gp">${esc(r.gp)}</span>`:''}</div>${r.amount?`<span class="amount">${esc(r.amount.label)}　${esc(r.amount.text)}</span>`:''}${r.d?`<span class="d">${esc(r.d)}</span>`:''}</li>`}).join('')}</ul>`;}
function src(label,s){if(!s?.url)return '';const ok=/^https:\/\/wikiwiki\.jp\/splatoon3mix\//.test(s.url);return `<p>${ok?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:esc(label)}　更新 ${esc(s.mod||'不明')}${s.tableVer?`／性能表 Ver.${esc(s.tableVer)}`:''}</p>`;}

function render(raw){
 const k=eff(raw),m=DATA.mains[k.main];if(!m)return;setTeam(m.class);
 const todoAll=pick(k,m,'todo');const todoRefs=list(k.display?.todo);
 let first=todoRefs.length?todoAll:todoAll.slice(0,3);
 const extra=[...list(m.todo).map((row,i)=>({scope:'main',row,i})),...list(k.todo).map((row,i)=>({scope:'kit',row,i}))].filter(e=>!first.some(f=>f.row===e.row));
 const tips=[...list(m.tips).map(row=>({scope:'main',row})),...list(k.tips).map(row=>({scope:'kit',row}))];
 const good=pick(k,m,'good'),bad=pick(k,m,'bad'),dont=pick(k,m,'dont');
 const kitDesc=n=>list(k.kit).find(r=>r.h===n)?.d||'';
 const role=k.role;const gearK=list(k.gear);
 $('card').innerHTML=`
 <header class="hero">
  <div class="mascots"><svg class="mascot squid" viewBox="0 0 40 46" aria-hidden="true"><path d="M20 1C22.5 1 38 15.5 38 19c0 1.6-1.4 2.2-3 2.2h-4.6V37a3.47 3.47 0 0 1-6.93 0 3.47 3.47 0 0 1-6.94 0 3.47 3.47 0 0 1-6.93 0V21.2H5c-1.6 0-3-.6-3-2.2C2 15.5 17.5 1 20 1Z"/></svg><svg class="mascot octo" viewBox="0 0 48 46" aria-hidden="true"><path d="M9 19A15 15 0 0 1 39 19C39 24.5 35 25.5 35 29C35 31 38 32 42 33C46 35.5 46.5 41 42 41C40 41 38.5 38 36.5 37.5C36 42 33.5 45.5 30.5 45C27.5 44.5 27.5 41 26.5 38.5C25.5 37 22.5 37 21.5 38.5C20.5 41 20.5 44.5 17.5 45C14.5 45.5 12 42 11.5 37.5C9.5 38 8 41 6 41C1.5 41 2 35.5 6 33C10 32 13 31 13 29C13 25.5 9 24.5 9 19Z"/></svg></div>
  <p class="hero-meta"><span>${esc(m.class)}</span><span>／</span><span>${esc(m.name)}系統</span></p>
  <h1>${esc(raw.name)}</h1>
  ${role&&(role.pos||role.text)?`<div class="tags">${role.pos?`<span class="sticker">${esc(role.pos)}</span>`:''}${role.text?`<span class="sticker alt">${esc(role.text)}</span>`:''}</div>`:''}
  ${k.gist?`<p class="gist">${esc(k.gist)}</p>`:''}
  ${raw.inherit&&k.inheritedFrom?`<p class="replica">性能・サブ・スペシャルは${esc(k.inheritedFrom.name)}と同じ</p>`:''}
 </header>${drip}
 <section class="block meter-card" aria-label="性能">
  ${meter(m)}
  ${list(m.keys).length?`<dl class="keys">${m.keys.map(x=>`<div><dt>${esc(x[0])}</dt><dd title="${esc(x[2])}: ${esc(x[1])}">${esc(x[3])}</dd></div>`).join('')}</dl>`:''}
  <dl class="loadout"><div><dt>サブ</dt><dd>${esc(k.sub||'—')}</dd></div><div><dt>スペシャル</dt><dd>${esc(k.special||'—')}<small>${esc(k.points||'')}</small></dd></div></dl>
  <details class="more"><summary>詳細性能</summary><dl class="spec">${list(m.spec).map(([l,v])=>`<div><dt>${esc(l)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
  <p class="note">射程は試し撃ちラインの本数。ヒト速は大きいほど速い。Fはフレーム（60F＝1秒）</p></details>
 </section>
 ${m.src?.stale?`<aside class="stale" role="note"><b>性能表が古い可能性があります</b>出典の性能表は Ver.${esc(m.src.tableVer||'?')} 時点です。最新値は出典で確認してください</aside>`:''}
 <section class="block"><h2>まずやること</h2>
  <ol class="todo">${first.map((e,i)=>`<li><div>${(i===0||first[i-1].scope!==e.scope)?`<span class="scope">${e.scope==='main'?'系統共通':'このブキ'}</span>`:''}<b>${e.row.lv?`<span class="lv">${esc(e.row.lv)}</span>`:''}${esc(e.row.h)}</b><span class="d">${esc(e.row.d)}</span></div></li>`).join('')}</ol>
  ${extra.length||tips.length?`<details class="more"><summary>ほかの使い方</summary>${grouped([...extra,...tips])}</details>`:''}
 </section>
 ${(()=>{const aim=list(m.aim),paint=[...list(m.paint).map(r=>({scope:'main',row:r})),...list(k.paint).map(r=>({scope:'kit',row:r}))];if(!aim.length&&!paint.length)return '';
  return `<section class="block match handle"><h2>メインの扱い方</h2>${aim.length?`<section class="good"><h3><span>当て方</span></h3>${items(aim)}</section>`:''}${paint.length?`<section class="good"><h3><span>塗り方</span></h3>${paint.some(e=>e.scope==='kit')?grouped(paint):items(paint.map(e=>e.row))}</section>`:''}</section>`;})()}
 ${dont.length?`<section class="block warn"><h2>やってはいけないこと</h2>${grouped(dont)}</section>`:''}
 ${good.length||bad.length?`<section class="block match"><h2>相性</h2>
  ${good.length?`<section class="good"><h3><span>得意</span></h3>${grouped(good)}</section>`:''}
  ${bad.length?`<section class="bad"><h3><span>苦手</span></h3>${grouped(bad)}</section>`:''}</section>`:''}
 <section class="block"><h2>サブとスペシャル</h2>${items([{h:k.sub,d:kitDesc(k.sub)},{h:k.special,d:kitDesc(k.special)}].filter(r=>r.h))}</section>
 <section class="block"><h2>ギア</h2>${list(m.gear).length?`<span class="scope">系統共通</span>${gearList(m.gear)}`:''}${gearK.length?`<span class="scope">このブキ</span>${gearList(gearK)}`:''}<p class="note">GPはギアパワーの量。メイン1個＝10、サブ1個＝3</p></section>
 <footer class="source">${src(m.name,m.src)}${raw.src?.url&&raw.src.url!==m.src?.url?src(raw.name,raw.src):''}${notice()}</footer>`;
 state.id=raw.id;try{localStorage.setItem(KEY,raw.id)}catch(_){}
}

function notice(){return `<p>出典：有志wiki（${esc(DATA.meta.sourceDomain||'wikiwiki.jp/splatoon3mix')}）を要約。非公式のファンメイド資料で、任天堂株式会社とは関係ありません。</p><p>「スプラトゥーン」「Splatoon」は任天堂の商標です。ブキ名などゲームに関する権利は任天堂に帰属します。</p>`}
function renderRange(){
 const mains=Object.entries(DATA.mains).filter(([,m])=>m.meter?.reach!=null&&(state.cls==='all'||m.class===state.cls));const pk=m=>m.meter.paint??-1,by=state.rsort==='paint'?[pk,m=>m.meter.reach]:[m=>m.meter.reach,pk];mains.sort((a,b)=>(by[0](b[1])-by[0](a[1]))||(by[1](b[1])-by[1](a[1])));
 const firstKit=id=>DATA.kits.find(k=>k.main===id);
 if(state.cls!=='all')setTeam(state.cls);else setTeam('シューター');
 $('range').innerHTML=`<div class="range-head"><h2 id="range-title">射程比較</h2><p>メイン${mains.length}種を${state.rsort==='paint'?'塗り射程':'射程'}が長い順に並べています。単位は試し撃ちラインの本数で、右端の数字は${state.rsort==='paint'?'上が塗り射程、下が射程':'上が射程、下の「ぬり」が塗り射程'}。ブキ種によって測り方が違う（有効射程・爆風射程など）ため、各ブキの詳細性能もあわせて確認してください</p>
 <div class="sortbar" role="group" aria-label="並び順">${[['reach','射程順'],['paint','塗り射程順']].map(([v,l])=>`<button type="button" class="chip" data-rsort="${v}" aria-pressed="${state.rsort===v}">${l}</button>`).join('')}</div>
 <div class="legend"><span><i style="background:var(--own);box-shadow:0 0 0 1.5px var(--ink) inset"></i>射程</span><span><i style="background:repeating-linear-gradient(-45deg,var(--own) 0 3px,transparent 3px 6px)"></i>塗り射程</span></div></div>
 <ol class="rlist"><li class="rscale" aria-hidden="true"><span></span><span class="ticks">${Array.from({length:MAX},(_,i)=>`<b style="left:${(i+1)/MAX*100}%">${i+1}</b>`).join('')}</span><span></span></li>${mains.map(([id,m])=>{const k=firstKit(id);const [own]=TEAM[m.class]||['#999'];
  return `<li style="--own:${own}"><a href="#${esc(encodeURIComponent(k?.id||''))}">${esc(m.name)}${m.src?.stale?'<span class="stale-mark" title="性能表が古い可能性あり">＊</span>':''}<small>${esc(m.class)}${shortLabel(m.meter.reachLabel)?'・'+esc(shortLabel(m.meter.reachLabel)):''}</small></a><span class="track">${m.meter.paint!=null?`<span class="fill paint" style="--v:${Math.min(m.meter.paint,MAX)}"></span>`:''}<span class="fill reach" style="--v:${Math.min(m.meter.reach,MAX)}"></span></span><span class="num">${state.rsort==='paint'&&m.meter.paint!=null?`${fmt(m.meter.paint)}<small>射程 ${fmt(m.meter.reach)}</small>`:`${fmt(m.meter.reach)}${m.meter.paint!=null?`<small>ぬり ${fmt(m.meter.paint)}</small>`:''}`}</span></li>`}).join('')}</ol><footer class="source">${notice()}</footer>`;}

/* ---- 操作 ---- */
function chips(){$('chips').innerHTML=[['all','すべて'],...CLASSES.map(c=>[c,c])].map(([v,l])=>`<button class="chip" type="button" data-cls="${esc(v)}" aria-pressed="${state.cls===v}" style="--c:${v==='all'?'var(--ink)':(TEAM[v]||[])[0]}"><i></i>${esc(l)}</button>`).join('');}
function update(prefer){
 filtered=DATA.kits.filter(matches);chips();
 $('count').textContent=state.q||state.cls!=='all'?`${filtered.length}件 / 全${DATA.kits.length}ブキ`:'';$('count').hidden=!$('count').textContent;
 const groups=new Map();for(const k of filtered){const c=cls(k);if(!groups.has(c))groups.set(c,[]);groups.get(c).push(k);}
 $('picker').innerHTML=[...groups].map(([c,ks])=>`<optgroup label="${esc(c)}">${ks.map(k=>`<option value="${esc(k.id)}">${esc(k.name)}</option>`).join('')}</optgroup>`).join('');
 $('clear').hidden=!state.q;
 if(state.view==='range'){renderRange();show();return;}
 const raw=filtered.find(k=>k.id===prefer)||filtered.find(k=>k.id===state.id)||filtered[0];
 if(raw){$('picker').value=raw.id;render(raw);}show();}
function show(){const r=state.view==='range';$('range').hidden=!r;$('card').hidden=r||!filtered.length;$('empty').hidden=r||filtered.length>0;$('range-toggle').setAttribute('aria-pressed',r);$('picker').disabled=r||!filtered.length;}
function go(id){if(!byId.has(id))return;if(!filtered.some(k=>k.id===id)){state.q='';state.cls='all';$('q').value='';}
 state.view='card';update(id);try{history.replaceState(null,'','#'+encodeURIComponent(id))}catch(_){}window.scrollTo(0,0);}
$('picker').addEventListener('change',e=>go(e.target.value));
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;state.cls=b.dataset.cls;update();});
$('q').addEventListener('input',e=>{state.q=e.target.value;update();});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&filtered.length){$('q').blur();}if(e.key==='Escape'){state.q='';e.target.value='';update();}});
$('clear').addEventListener('click',()=>{state.q='';$('q').value='';update();$('q').focus();});
$('search-toggle').addEventListener('click',e=>{const on=$('search-row').hidden;$('search-row').hidden=!on;e.currentTarget.setAttribute('aria-pressed',on);if(on)$('q').focus();else if(state.q){state.q='';$('q').value='';update();}});
$('range-toggle').addEventListener('click',()=>{state.view=state.view==='range'?'card':'range';try{history.replaceState(null,'',state.view==='range'?'#range':'#'+encodeURIComponent(state.id))}catch(_){}update();window.scrollTo(0,0);});
$('reset').addEventListener('click',()=>{state.q='';state.cls='all';$('q').value='';update();});
$('range').addEventListener('click',e=>{const sb=e.target.closest('[data-rsort]');if(sb){if(state.rsort!==sb.dataset.rsort){state.rsort=sb.dataset.rsort;renderRange();}return;}const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();go(decodeURIComponent(a.getAttribute('href').slice(1)));});
function route(){let h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(_){}if(h==='range'){state.view='range';update();}else if(byId.has(h))go(h);}
window.addEventListener('hashchange',route);
let init='';try{init=decodeURIComponent(location.hash.slice(1))}catch(_){}
if(init==='range'){state.view='range';update();}else{let id=byId.has(init)?init:'';try{id=id||localStorage.getItem(KEY)||''}catch(_){}update(id);}
</script>
</body>
</html>
